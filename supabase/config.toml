# Partial config: function JWT flags only. This repo does not run a full local
# Supabase stack. Deploy lh-agent-api with verify_jwt OFF — it authenticates
# with household agent tokens (Authorization: Bearer lh_...), not user JWTs.

[functions.lh-categorize]
verify_jwt = true

[functions.lh-recipe-import]
verify_jwt = true

[functions.lh-agent-api]
verify_jwt = false
